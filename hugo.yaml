baseURL: https://jp-game.com/
languageCode: en-us
title: JP Game
theme: PaperMod
pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# GA4 property ID (starts with "G-"). Universal Analytics (UA-...) stopped
# processing data in July 2023, so the old placeholder has been removed.
# Add your real GA4 ID here, e.g. "G-XXXXXXXXXX", or delete this line to
# disable Google Analytics entirely.
# googleAnalytics: G-XXXXXXXXXX

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: JP Game
  description: "Tutorials, guides and reviews for Microsoft Flight Simulator - aircraft, avionics, controllers and addons."
  keywords: [Blog, MSFS2020, Tutorials, Reviews, Addons, Aircraft]
  author: JPGame
  # author: ["Me", "You"] # multiple authors
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  pageFeatures: [+sticky_menu]

  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: true
  hideSummary: false
  showtoc: true
  tocopen: true

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    # safari_pinned_tab: "/safari-pinned-tab.svg" # add if you have this asset
    logo: "/logo.svg"

  label:
    icon: logo.svg
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # Add your real verification tags below (from Google Search Console, Bing
  # Webmaster Tools, Yandex Webmaster) as needed. Leaving fake placeholder
  # values in place will fail verification, so they've been removed for now.
  # analytics:
  #   google:
  #     SiteVerificationTag: "your-real-tag-here"
  #   bing:
  #     SiteVerificationTag: "your-real-tag-here"
  #   yandex:
  #     SiteVerificationTag: "your-real-tag-here"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: Home
      name: Home
      url: /
      weight: 50

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai